<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='none' stroke='%23c9a227' stroke-width='2'/></svg>" />
    <title>artshape — meshing spike</title>
    <style>
      :root {
        --bg: #0b0c0e;
        --panel: #16181c;
        --line: #2a2e35;
        --text: #d8dce3;
        --dim: #838b98;
        --accent: #c9a227;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      /* The panel takes a share of the width between two bounds, so a wide
         screen gives the viewport the room and a narrow one keeps the controls
         usable. The editor's height is the writer's: dragged, and remembered. */
      :root { --panel-w: clamp(250px, 21vw, 340px); --editor-h: 40vh; }
      #app { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w);
        grid-template-rows: minmax(0, 1fr) auto; height: 100%; overflow: hidden; }
      #stage { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0; }
      /* clamp, not height: at a short viewport a fixed height pushed the stage
         row past the bottom of the grid, so the canvas was sized to a box taller
         than the space it was actually drawn into */
      #editor { grid-column: 1; grid-row: 2; display: none; border-top: 1px solid var(--line);
        background: #0e1013; height: clamp(200px, var(--editor-h), calc(100vh - 160px)); min-height: 0;
        position: relative; }
      #editor.open { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      #splitter { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: row-resize; z-index: 2; }
      #splitter:hover, #splitter.dragging { background: linear-gradient(transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
      body.resizing { cursor: row-resize; user-select: none; }
      body.resizing #stage { pointer-events: none; }
      /* Tablet: the source needs width more than the controls need height, so
         the editor runs the full width and the panel sits beside the viewport only. */
      @media (max-width: 1100px) {
        :root { --panel-w: 230px; }
        #app { grid-template-rows: minmax(0, 1fr) auto; }
        #editor { grid-column: 1 / span 2; }
        #panel { grid-row: 1; padding: 12px; }
      }
      /* Desktop: a little more text on a lot more pixels. */
      @media (min-width: 1900px) {
        html, body { font-size: 14px; }
        #source .cm-editor { font-size: 13px; }
      }
      #palette { display: flex; align-items: stretch; gap: 4px; padding: 6px 10px; overflow-x: auto;
        border-bottom: 1px solid var(--line); scrollbar-width: thin; }
      #palette .tile, #palette .chip { flex: none; background: transparent; border: 1px solid transparent;
        border-radius: 4px; color: var(--dim); font: inherit; font-size: 10px; cursor: pointer; padding: 2px; }
      #palette .tile { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 56px; }
      #palette .tile .pic { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
      #palette .tile:hover, #palette .chip:hover { border-color: var(--line); color: var(--text); background: #14161a; }
      #palette .chip { align-self: center; padding: 3px 7px; color: #8fa3c7; }
      #palette .rule { flex: none; width: 1px; background: var(--line); margin: 6px 6px; }
      #source { min-height: 0; overflow: hidden; }
      #source .cm-editor { height: 100%; }
      #source .cm-editor.cm-focused { outline: none; }
      #diagnostic { padding: 6px 14px; border-top: 1px solid var(--line); font-size: 11px;
        white-space: pre-wrap; color: #6fcf7f; display: flex; justify-content: space-between; gap: 12px; }
      #diagnostic .hint { color: var(--dim); white-space: nowrap; }
      #diagnostic.bad .hint { display: none; }
      #diagnostic.bad { color: #e07a5f; }
      /* absolute so the canvas cannot push the grid cell it is measured against */
      #stage canvas { display: block; position: absolute; top: 0; left: 0; }
      #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      #labels .label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
        font-size: 10px; line-height: 1; padding: 2px 4px; margin: -18px 0 0 6px; border-radius: 2px;
        color: #f2d27a; background: rgba(11, 12, 14, 0.72); white-space: nowrap; }
      #labels .label:hover { color: var(--bg); background: var(--accent); }
      #panel { grid-column: 2; grid-row: 1 / span 2; border-left: 1px solid var(--line);
        background: var(--panel); padding: 16px; overflow-y: auto; }
      h1 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--accent); margin: 0 0 4px; }
      .sub { color: var(--dim); margin: 0 0 18px; font-size: 11px; }
      fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 14px; padding: 12px 0 0; }
      legend { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 0 6px 0 0; }
      label { display: block; margin-bottom: 10px; }
      .row { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 3px; }
      .row b { color: var(--text); font-weight: 500; }
      input[type=range] { width: 100%; accent-color: var(--accent); }
      .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .actions button { background: transparent; border: 1px solid var(--line); border-radius: 3px;
        color: var(--dim); font: inherit; font-size: 10px; padding: 3px 7px; cursor: pointer; }
      .actions button:hover { color: var(--text); border-color: var(--dim); }
      select { width: 100%; background: #0e1013; color: var(--text); border: 1px solid var(--line);
        border-radius: 3px; padding: 5px 6px; font: inherit; }
      input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
      .check { color: var(--dim); font-size: 11px; display: flex; align-items: center; }
      table { width: 100%; border-collapse: collapse; font-size: 11px; }
      td { padding: 2px 0; color: var(--dim); }
      td:last-child { text-align: right; color: var(--text); }
      td.hi:last-child { color: var(--accent); }
      td.warn:last-child { color: #e07a5f; }
      .budget { margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 3px;
        font-size: 11px; color: var(--dim); }
      .budget b { display: block; font-size: 15px; margin-bottom: 2px; }
      .pass { color: #6fcf7f; } .fail { color: #e07a5f; }
      .note { color: #e07a5f; font-size: 10px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="editor">
        <div id="splitter" title="drag to resize the editor"></div>
        <div id="palette"></div>
        <div id="source"></div>
        <div id="diagnostic"></div>
      </div>
      <div id="panel">
        <h1>artshape</h1>
        <p class="sub">Parametric parts, mated by anchors, multiplied by symmetry, and lit by a procedurally baked environment.</p>
        <div id="controls"></div>
        <fieldset>
          <legend>Result</legend>
          <table id="stats"></table>
          <div class="budget" id="budget"></div>
        </fieldset>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
